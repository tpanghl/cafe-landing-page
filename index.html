<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모닝빈 카페</title>
<style>
  :root { --brown:#4b2e1e; --cream:#faf3e8; --accent:#c8793a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Malgun Gothic',sans-serif; color:var(--brown); background:var(--cream); line-height:1.6; }
  header { display:flex; justify-content:space-between; align-items:center; padding:20px 8%; }
  header strong { font-size:1.4rem; }
  nav a { margin-left:20px; color:var(--brown); text-decoration:none; }
  .hero { text-align:center; padding:100px 8%; background:linear-gradient(rgba(75,46,30,.65),rgba(75,46,30,.65)),#7a5236; color:#fff; }
  .hero h1 { font-size:2.6rem; margin-bottom:16px; }
  .hero a { display:inline-block; margin-top:28px; padding:14px 32px; background:var(--accent); color:#fff; border-radius:30px; text-decoration:none; }
  section { padding:70px 8%; text-align:center; }
  h2 { margin-bottom:32px; font-size:1.8rem; }
  .menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
  .card { background:#fff; border-radius:14px; padding:28px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
  .card span { display:block; margin-top:8px; color:var(--accent); font-weight:bold; }
  footer { background:var(--brown); color:var(--cream); padding:30px 8%; text-align:center; }
</style>
</head>
<body>
<header>
  <strong>☕ 모닝빈</strong>
  <nav><a href="#menu">메뉴</a><a href="#about">소개</a><a href="#visit">오시는 길</a></nav>
</header>

<div class="hero">
  <h1>하루의 시작, 한 잔의 여유</h1>
  <p>매일 아침 직접 로스팅한 원두로 내려드립니다.</p>
  <a href="#menu">메뉴 보기</a>
</div>

<section id="menu">
  <h2>대표 메뉴</h2>
  <div class="menu">
    <div class="card">아메리카노<span>4,000원</span></div>
    <div class="card">카페라떼<span>4,800원</span></div>
    <div class="card">바닐라빈 라떼<span>5,500원</span></div>
    <div class="card">수제 티라미수<span>6,500원</span></div>
  </div>
</section>

<section id="about" style="background:#fff;">
  <h2>모닝빈 이야기</h2>
  <p>좋은 원두, 따뜻한 공간, 편안한 시간.<br>동네 사람들의 아늑한 쉼터가 되고 싶습니다.</p>
</section>

<section id="visit">
  <h2>오시는 길</h2>
  <p>서울시 어딘가 123 · 매일 08:00 – 21:00<br>문의 02-123-4567</p>
</section>

<footer>© 2026 모닝빈 카페. All rights reserved.</footer>
</body>
</html>
